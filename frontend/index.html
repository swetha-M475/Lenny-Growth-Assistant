<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenny Growth Assistant — AI-Powered Product Insights</title>
    <meta name="description" content="Ask product management and growth questions powered by Lenny's Podcast transcripts. Get Ship30for30 essays and rich artifacts.">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight/lib/index.umd.js"></script>
    
    <!-- html2pdf for PDF downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- JSZip for dynamic ZIP package downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad1)" opacity="0.9"/>
                            <path d="M2 17L12 22L22 17" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22">
                                    <stop offset="0%" stop-color="#a78bfa"/>
                                    <stop offset="100%" stop-color="#6c5ce7"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">Lenny Assistant</span>
                </div>
                <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
            </div>

            <button id="new-chat-btn" class="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>New Chat</span>
            </button>

            <div class="sessions-list" id="sessions-list">
                <!-- Sessions rendered by JS -->
            </div>

            <div class="sidebar-footer">
                <button id="settings-btn" class="settings-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>Settings</span>
                </button>
                <div class="provider-badge" id="provider-badge">
                    <span class="provider-dot"></span>
                    <span id="provider-label">Ollama</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Chat Area -->
            <div id="chat-area" class="chat-area">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button id="mobile-menu-btn" class="mobile-menu-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <h1 id="chat-title" class="chat-title">New Chat</h1>
                    <div class="chat-header-actions">
                        <button id="artifact-toggle-btn" class="artifact-toggle-btn" style="display:none" title="Toggle Artifact Panel">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M12 3v18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messages-container" class="messages-container">
                    <!-- Welcome Screen -->
                    <div id="welcome-screen" class="welcome-screen">
                        <div class="welcome-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#wgrad)" opacity="0.8"/>
                                <path d="M2 17L12 22L22 17" stroke="url(#wgrad)" stroke-width="2" stroke-linecap="round"/>
                                <path d="M2 12L12 17L22 12" stroke="url(#wgrad)" stroke-width="2" stroke-linecap="round"/>
                                <defs>
                                    <linearGradient id="wgrad" x1="2" y1="2" x2="22" y2="22">
                                        <stop offset="0%" stop-color="#a78bfa"/>
                                        <stop offset="100%" stop-color="#6c5ce7"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <h2 class="welcome-title">The Lenny Growth Assistant</h2>
                        <p class="welcome-subtitle">Ask product management &amp; growth questions powered by 269 episodes of Lenny's Podcast</p>
                        <div class="welcome-suggestions">
                            <button class="suggestion-chip" data-prompt="What are the best frameworks for finding product-market fit?">
                                🎯 Product-Market Fit Frameworks
                            </button>
                            <button class="suggestion-chip" data-prompt="Write a Ship30for30 essay about growth loops and their importance">
                                ✍️ Ship30 Essay: Growth Loops
                            </button>
                            <button class="suggestion-chip" data-prompt="What advice do top PMs give about prioritization?">
                                📋 PM Prioritization Advice
                            </button>
                            <button class="suggestion-chip" data-prompt="Create an HTML infographic showing the key traits of successful product leaders">
                                🎨 Create: Leadership Infographic
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input-container">
                    <div class="skill-selector">
                        <select id="skill-select" class="skill-select">
                            <option value="auto">🤖 Auto-detect</option>
                            <option value="qa">💬 Q&A</option>
                            <option value="ship30for30">✍️ Ship30for30 Essay</option>
                            <option value="artifact">🎨 Artifact</option>
                        </select>
                    </div>
                    <div class="input-wrapper">
                        <textarea 
                            id="chat-input" 
                            class="chat-input" 
                            placeholder="Ask about product, growth, or leadership insights from Lenny's Podcast..."
                            rows="1"
                        ></textarea>
                        <button id="voice-btn" class="voice-btn" title="Click to speak" type="button">
                            <svg id="voice-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </button>
                        <button id="send-btn" class="send-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Press Enter to send · Shift+Enter for new line · Powered by Lenny's Podcast transcripts</p>
                </div>
            </div>

            <!-- Chat/Artifact Splitter Handle -->
            <div id="chat-artifact-splitter" class="chat-artifact-splitter hidden" title="Drag to Resize">
                <div class="splitter-line"></div>
            </div>

            <!-- Redesigned Artifact Panel -->
            <div id="artifact-panel" class="artifact-panel hidden">
                <div class="artifact-header">
                    <div class="artifact-tabs" id="artifact-tabs">
                        <!-- File Tabs (e.g. "landing_page.html") rendered by JS -->
                    </div>
                    <div class="artifact-header-right">
                        <!-- Interactive View Modes (HTML/CSS/JS only) -->
                        <div class="artifact-view-modes" id="artifact-view-modes">
                            <button id="mode-preview" class="mode-tab active" title="Interactive Preview">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <span>Preview</span>
                            </button>
                            <button id="mode-code" class="mode-tab" title="View Source Code">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="16 18 22 12 16 6"/>
                                    <polyline points="8 6 2 12 8 18"/>
                                </svg>
                                <span>Code</span>
                            </button>
                            <button id="mode-split" class="mode-tab" title="Split View">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="12" y1="3" x2="12" y2="21"/>
                                </svg>
                                <span>Split</span>
                            </button>
                        </div>

                        <!-- Action Toolbar -->
                        <div class="artifact-actions">
                            <button id="artifact-refresh-btn" class="artifact-action-btn" title="Refresh Preview">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                                </svg>
                            </button>
                            <button id="artifact-copy-btn" class="artifact-action-btn" title="Copy Code">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            </button>
                            <button id="artifact-download-html-btn" class="artifact-action-btn" title="Download HTML File">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="12" y1="18" x2="12" y2="12"/>
                                    <polyline points="9 15 12 18 15 15"/>
                                </svg>
                            </button>
                            <button id="artifact-download-zip-btn" class="artifact-action-btn" title="Download Code as ZIP">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                                    <line x1="12" y1="11" x2="12" y2="17"/>
                                    <polyline points="9 14 12 17 15 14"/>
                                </svg>
                            </button>
                            <button id="artifact-fullscreen-btn" class="artifact-action-btn" title="Full Screen View">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                                </svg>
                            </button>
                            <button id="artifact-close-btn" class="artifact-action-btn" title="Close Panel">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="artifact-content" id="artifact-content">
                    <div id="artifact-viewport" class="artifact-viewport mode-preview">
                        <!-- Preview Pane -->
                        <div id="artifact-preview-pane" class="artifact-pane">
                            <iframe id="artifact-iframe" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
                        </div>
                        
                        <!-- Split View Resize Splitter -->
                        <div id="artifact-split-splitter" class="artifact-split-splitter">
                            <div class="splitter-line"></div>
                        </div>
                        
                        <!-- Source Code Pane -->
                        <div id="artifact-code-pane" class="artifact-pane">
                            <div class="code-viewer-wrapper">
                                <div class="line-numbers" id="line-numbers"></div>
                                <pre><code id="artifact-code-block" class="language-html"></code></pre>
                            </div>
                        </div>

                        <!-- Markdown Content Fallback -->
                        <div id="artifact-markdown-pane" class="artifact-pane hidden">
                            <div class="markdown-render" id="artifact-markdown-render"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ LLM Settings</h2>
                <button id="settings-close-btn" class="modal-close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label class="setting-label">LLM Provider</label>
                    <div class="provider-cards">
                        <button class="provider-card active" data-provider="ollama">
                            <span class="provider-icon">🦙</span>
                            <span class="provider-name">Ollama</span>
                            <span class="provider-desc">Local LLM</span>
                        </button>
                        <button class="provider-card" data-provider="anthropic">
                            <span class="provider-icon">🧠</span>
                            <span class="provider-name">Claude</span>
                            <span class="provider-desc">Anthropic</span>
                        </button>
                        <button class="provider-card" data-provider="openai">
                            <span class="provider-icon">💚</span>
                            <span class="provider-name">GPT</span>
                            <span class="provider-desc">OpenAI</span>
                        </button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="model-input">Model Name</label>
                    <input type="text" id="model-input" class="setting-input" placeholder="e.g., llama3.1:8b">
                </div>
                <div class="setting-group" id="api-key-group" style="display:none">
                    <label class="setting-label" for="api-key-input">API Key</label>
                    <input type="password" id="api-key-input" class="setting-input" placeholder="sk-...">
                </div>
                <div class="setting-actions">
                    <button id="test-connection-btn" class="btn-secondary">Test Connection</button>
                    <button id="save-settings-btn" class="btn-primary">Save Changes</button>
                </div>
                <div id="connection-status" class="connection-status"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Artifact Modal -->
    <div id="fullscreen-artifact-modal" class="modal-overlay hidden">
        <div class="fullscreen-modal-content">
            <div class="fullscreen-modal-header">
                <h2 id="fullscreen-modal-title">Artifact Preview</h2>
                <div class="fullscreen-modal-actions">
                    <button id="fullscreen-refresh-btn" class="artifact-action-btn" title="Refresh Preview">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                    </button>
                    <button id="fullscreen-close-btn" class="modal-close-btn" title="Exit Full Screen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="fullscreen-modal-body" id="fullscreen-modal-body">
                <!-- Loaded iframe inside fullscreen mode -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
